# Build candidates are created on pull requests from one source commit pinned
# below. Releases publish the already-reviewed files from this repository;
# they never rebuild a different byte stream.

name: Build submarine

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_REPO: FyraLabs/submarine
  UPSTREAM_COMMIT: 63ee8df1d55e384fee02f6bfedabca791f44f082
  ZIP_NAME: submarine-x86_64.zip
  BUILDINFO_NAME: submarine-x86_64.buildinfo

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # actions/checkout@v6.0.2
      - name: Checkout pinned FyraLabs/submarine source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_COMMIT }}
          submodules: recursive
          persist-credentials: false

      - name: Record source commits
        id: pins
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${UPSTREAM_COMMIT}"
          UROOT="$(git rev-parse HEAD:u-root)"
          KERNEL="$(git rev-parse HEAD:kernel)"
          echo "uroot=${UROOT}" >> "${GITHUB_OUTPUT}"
          echo "kernel=${KERNEL}" >> "${GITHUB_OUTPUT}"
          {
            echo "upstream_repo=https://github.com/${UPSTREAM_REPO}"
            echo "upstream_commit=${UPSTREAM_COMMIT}"
            echo "u-root_commit=${UROOT}"
            echo "kernel_commit=${KERNEL}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "runner_os=${RUNNER_OS}"
            echo "image_os=${ImageOS:-unknown}"
          } | tee "${BUILDINFO_NAME}"

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gcc make flex bison bc \
            libssl-dev libelf-dev \
            xz-utils parted \
            vboot-utils vboot-kernel-utils cgpt \
            git patch file zip cpio python3 \
            ca-certificates
          test -f /usr/share/vboot/devkeys/kernel_data_key.vbprivk
          test -f /usr/share/vboot/devkeys/kernel.keyblock
          command -v futility
          command -v cgpt

      # actions/setup-go@v6.1.0
      - name: Setup Go from pinned u-root go.mod
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: u-root/go.mod
          cache-dependency-path: u-root/go.sum

      - name: Install u-root from the pinned submodule
        run: |
          set -euo pipefail
          ( cd u-root && go install )
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
          "$(go env GOPATH)/bin/u-root" --help >/dev/null

      - name: Build x86_64 with the upstream Makefile
        run: make -j"$(nproc)" x86_64

      - name: Self-check artifacts
        run: |
          set -euo pipefail
          cd build
          test -f bzImage.x86
          test -f submarine-x86.bin
          test -f submarine-x86.kpart
          test -f u-root-x86.cpio
          test -f u-root-x86.cpio.xz

          bin_desc="$(file -b submarine-x86.bin)"
          kernel_desc="$(file -b bzImage.x86)"
          echo "submarine-x86.bin: ${bin_desc}"
          echo "bzImage.x86: ${kernel_desc}"
          grep -Eq 'DOS/MBR boot sector' <<<"${bin_desc}"
          grep -Eqi 'Linux kernel.*bzImage' <<<"${kernel_desc}"
          grep -a -q CHROMEOS submarine-x86.kpart

          extract="$(mktemp -d)"
          cpio_path="$(pwd)/u-root-x86.cpio"
          ( cd "${extract}" && cpio -id --quiet --no-absolute-filenames \
              'etc/uinit.flags' < "${cpio_path}" )
          flags="${extract}/etc/uinit.flags"
          test -f "${flags}"
          normalized="$(tr '\n' ' ' < "${flags}" | sed 's/[[:space:]]*$//')"
          expected='"-c" "sleep 3; boot"'
          test "${normalized}" = "${expected}"

      - name: Pack candidate and provenance
        run: |
          set -euo pipefail
          mkdir -p dist
          ( cd build && zip -X -9 "../dist/${ZIP_NAME}" \
              bzImage.x86 \
              submarine-x86.bin \
              submarine-x86.kpart \
              u-root-x86.cpio \
              u-root-x86.cpio.xz )
          ZIP_SHA="$(sha256sum "dist/${ZIP_NAME}" | awk '{print $1}')"
          BIN_SHA="$(sha256sum build/submarine-x86.bin | awk '{print $1}')"
          {
            echo "zip_sha256=${ZIP_SHA}"
            echo "submarine-x86.bin_sha256=${BIN_SHA}"
            echo "gcc=$(gcc --version | head -1)"
            echo "go=$(go version)"
          } | tee -a "${BUILDINFO_NAME}"
          cp "${BUILDINFO_NAME}" "dist/${BUILDINFO_NAME}"

          {
            echo "## Submarine candidate build"
            echo
            echo "- upstream: \`${UPSTREAM_REPO}@${UPSTREAM_COMMIT}\`"
            echo "- u-root: \`${{ steps.pins.outputs.uroot }}\`"
            echo "- kernel: \`${{ steps.pins.outputs.kernel }}\`"
            echo "- \`${ZIP_NAME}\` sha256: \`${ZIP_SHA}\`"
            echo "- \`submarine-x86.bin\` sha256: \`${BIN_SHA}\`"
            echo
            echo "Commit both downloaded files and update the installer hash together."
          } >> "${GITHUB_STEP_SUMMARY}"

      # actions/upload-artifact@v7.0.1
      - name: Upload candidate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: submarine-x86_64
          path: |
            dist/${{ env.ZIP_NAME }}
            dist/${{ env.BUILDINFO_NAME }}
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # actions/checkout@v6.0.2
      - name: Checkout reviewed release files
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Verify archive, provenance, and installer pin
        id: verify
        run: |
          set -euo pipefail

          value() {
            local key="$1"
            local result
            result="$(sed -n "s/^${key}=//p" "${BUILDINFO_NAME}")"
            [[ -n "${result}" && "${result}" != *$'\n'* ]]
            printf '%s' "${result}"
          }

          test -f "${ZIP_NAME}"
          test -f "${BUILDINFO_NAME}"
          unzip -t "${ZIP_NAME}"

          UPSTREAM_SHA="$(value upstream_commit)"
          ZIP_SHA="$(sha256sum "${ZIP_NAME}" | awk '{print $1}')"
          EXPECTED_ZIP_SHA="$(value zip_sha256)"
          BIN_SHA="$(unzip -p "${ZIP_NAME}" submarine-x86.bin | sha256sum | awk '{print $1}')"
          EXPECTED_BIN_SHA="$(value submarine-x86.bin_sha256)"
          INSTALLER_SHA="$(sed -n 's/^SUBMARINE_ZIP_SHA256="\([0-9a-f]\{64\}\)"$/\1/p' cromarchy)"

          [[ "${UPSTREAM_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${UPSTREAM_SHA}" = "${UPSTREAM_COMMIT}"
          test "$(value upstream_repo)" = "https://github.com/${UPSTREAM_REPO}"
          test "${ZIP_SHA}" = "${EXPECTED_ZIP_SHA}"
          test "${BIN_SHA}" = "${EXPECTED_BIN_SHA}"
          test "${ZIP_SHA}" = "${INSTALLER_SHA}"

          echo "upstream_sha=${UPSTREAM_SHA}" >> "${GITHUB_OUTPUT}"
          echo "upstream_short=${UPSTREAM_SHA:0:12}" >> "${GITHUB_OUTPUT}"
          echo "zip_sha=${ZIP_SHA}" >> "${GITHUB_OUTPUT}"
          echo "zip_short=${ZIP_SHA:0:12}" >> "${GITHUB_OUTPUT}"
          echo "bin_sha=${BIN_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Write release notes
        env:
          UPSTREAM_SHA: ${{ steps.verify.outputs.upstream_sha }}
          ZIP_SHA: ${{ steps.verify.outputs.zip_sha }}
          BIN_SHA: ${{ steps.verify.outputs.bin_sha }}
        run: |
          set -euo pipefail
          UROOT="$(sed -n 's/^u-root_commit=//p' "${BUILDINFO_NAME}")"
          KERNEL="$(sed -n 's/^kernel_commit=//p' "${BUILDINFO_NAME}")"
          BUILD_RUN="$(sed -n 's/^run_url=//p' "${BUILDINFO_NAME}")"
          cat > RELEASE.md <<EOF
          Submarine x86_64 built by cromarchy CI from pinned FyraLabs/submarine source.

          | Field | Value |
          | --- | --- |
          | Upstream | https://github.com/${UPSTREAM_REPO} |
          | Upstream commit | \`${UPSTREAM_SHA}\` |
          | u-root submodule | \`${UROOT}\` |
          | kernel submodule | \`${KERNEL}\` |
          | \`${ZIP_NAME}\` sha256 | \`${ZIP_SHA}\` |
          | \`submarine-x86.bin\` sha256 | \`${BIN_SHA}\` |
          | Original build | ${BUILD_RUN} |
          | Verified release run | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |

          These are the exact files committed to the repository and pinned by the installer.
          EOF

      # softprops/action-gh-release@v3.0.3
      - name: Publish verified repository artifact
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: submarine/${{ steps.verify.outputs.upstream_short }}-${{ steps.verify.outputs.zip_short }}
          name: Submarine x86_64 (${{ steps.verify.outputs.upstream_short }})
          body_path: RELEASE.md
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.BUILDINFO_NAME }}
          make_latest: true
          fail_on_unmatched_files: true
          target_commitish: ${{ github.sha }}
